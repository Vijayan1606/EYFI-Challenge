<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="description" content="EYFI Challenge Live Leaderboard — Track top earners and hustlers across colleges.">
  <title>EYFI Challenge — Leaderboard</title>
  <link rel="icon" href="favico.png" type="image/x-icon">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="rupee-field" id="rupeeField" aria-hidden="true"></div>

  <div class="wrap">
    <header>
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">₹</div>
        <div class="brand-name">EYFI <span>Leaderboard</span></div>
      </div>
      <div class="days-left" aria-label="Challenge status: Day 18 of 30">
        <span class="days-dot" aria-hidden="true"></span>
        Day <b>18</b>/30
      </div>
    </header>

    <div class="ticker-shell" aria-label="Live earnings updates ticker">
      <div class="ticker-track" id="tickerTrack" role="marquee"></div>
    </div>

    <div class="title-block">
      <h1>Who's earning the most right now?</h1>
      <p>Every rupee counts — tap anyone to see how they're hustling. Updated live as the challenge rolls on.</p>
    </div>

    <div class="controls">
      <div class="tabs" id="tabs" role="tablist" aria-label="Time period range">
        <button class="tab active" data-range="7d" role="tab" aria-selected="true" id="tab-7d">This week</button>
        <button class="tab" data-range="all" role="tab" aria-selected="false" id="tab-all">All time</button>
        <button class="tab" data-range="today" role="tab" aria-selected="false" id="tab-today">Today</button>
      </div>
      <div class="search-row">
        <div class="search-box">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="searchInput" placeholder="Find yourself or a friend…" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Search participants by name or college">
          <button type="button" class="search-clear" id="searchClear" aria-label="Clear search" style="display: none;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="chips-wrapper">
      <div class="chips" id="chips" role="region" aria-label="Filter by category"></div>
    </div>

    <div class="status-summary" id="statusSummary" aria-live="polite" style="display: none;"></div>

    <div class="podium" id="podium" aria-label="Top 3 performers podium"></div>
    <div class="list" id="list" role="feed" aria-label="Leaderboard ranking list"></div>

    <div class="load-more-container">
      <button class="load-more" id="loadMore" type="button">Show more hustlers</button>
    </div>

    <footer>
      <p>EYFI Challenge · Earn Your First Income · Wave 01</p>
      <span class="footer-sub">Real-time sync active</span>
    </footer>
  </div>

  <!-- Student Profile Detail Modal / Bottom Sheet -->
  <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
    <div class="modal-sheet" id="modalSheet" role="dialog" aria-modal="true" aria-labelledby="modalStudentName">
      <button type="button" class="modal-close" id="modalClose" aria-label="Close profile details">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="modal-content" id="modalContent"></div>
    </div>
  </div>

  <!-- Toast Notification System -->
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <script src="script.js" defer></script>
</body>
</html>
